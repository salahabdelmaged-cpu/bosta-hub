<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOSTA HUB - NC</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg: #0a0e17; --card: #111827; --card-border: #1f2937;
      --primary: #ff5722; --green: #10b981; --red: #ef4444;
      --cancel-rto: #b91c1c; --orange: #f59e0b; --text: #f9fafb; --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    header { 
      display: flex; justify-content: space-between; align-items: center; 
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%); 
      padding: 18px 25px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 20px; flex-wrap: wrap; gap: 15px; 
    }
    header h1 { font-size: 22px; color: #fff; display: flex; align-items: center; gap: 12px; }
    header h1 i { color: var(--primary); }
    .user-badge {
      display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05);
      padding: 6px 14px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
    }
    .user-badge input { background: transparent; border: none; color: var(--primary); font-weight: 900; font-size: 15px; outline: none; width: 100px; text-align: center; }
    .top-bar { 
      background: var(--card); padding: 15px 20px; border-radius: 14px; margin-bottom: 20px; 
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; 
      border: 1px solid var(--card-border);
    }
    .btn { 
      padding: 10px 18px; border-radius: 10px; border: none; font-weight: 800; font-size: 13px; 
      cursor: pointer; transition: all 0.2s ease-in-out; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
    .btn-cancel-rto { background: linear-gradient(135deg, #b91c1c, #991b1b); color: #fff; border: 1px solid #f87171; }
    .btn-print { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    .scanner-box { 
      background: linear-gradient(180deg, rgba(17,24,39,0.8) 0%, rgba(15,23,42,0.9) 100%); 
      padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 25px; 
      border: 2px dashed rgba(255, 87, 34, 0.4); 
    }
    .scan-input { 
      width: 90%; max-width: 550px; padding: 16px 20px; font-size: 26px; border-radius: 12px; 
      border: 2px solid #334155; text-align: center; font-weight: 900; background: #030712; color: #00ffcc; outline: none; 
    }
    .alert-banner { display: none; margin-top: 20px; padding: 20px; border-radius: 14px; font-size: 24px; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .alert-CANCEL { background: linear-gradient(135deg, #ef4444, #991b1b); }
    .alert-CANCEL_RTO { background: linear-gradient(135deg, #b91c1c, #450a0a); border: 2px solid #f87171; }
    .alert-OTHER { background: linear-gradient(135deg, #374151, #1f2937); }
    .alert-DUPLICATE { background: linear-gradient(135deg, #f59e0b, #b45309); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: var(--card); padding: 18px 15px; border-radius: 14px; text-align: center; border: 1px solid var(--card-border); }
    .stat-card p { color: var(--text-muted); font-size: 12px; font-weight: 800; }
    .stat-card h3 { font-size: 28px; color: #fff; margin-top: 5px; font-weight: 900; }
    .action-panel { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
    .action-panel button { flex: 1; padding: 14px; border-radius: 12px; min-width: 180px; justify-content: center; }
    .table-container { background: var(--card); border-radius: 16px; border: 1px solid var(--card-border); overflow: hidden; }
    .logs-table { width: 100%; border-collapse: collapse; }
    .logs-table th, .logs-table td { padding: 14px; text-align: center; border-bottom: 1px solid var(--card-border); font-size: 13px; }
    .logs-table th { background: #1f2937; color: var(--primary); font-weight: 900; }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-s"></i> BOSTA HUB - NC</h1>
    <div class="user-badge">
      <i class="fa-solid fa-user-gear" style="color:var(--primary)"></i>
      <span>الموظف:</span>
      <input type="text" id="username" value="الموظف 1">
    </div>
  </header>

  <div class="top-bar">
    <div>
      <label for="excelFile" class="btn btn-green"><i class="fa-solid fa-file-excel"></i> رفع الشيت الرئيسي</label>
      <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" style="display:none;">
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="btn btn-red" onclick="resetDayData()"><i class="fa-solid fa-trash"></i> تصفير شغل اليوم</button>
      <span id="syncStatus" style="font-size:13px; color:var(--orange); font-weight:900;">● جاري التوصيل...</span>
    </div>
  </div>

  <div class="scanner-box">
    <input type="text" id="barcode" class="scan-input" placeholder="READY TO SCAN..." autofocus autocomplete="off">
    <div style="margin-top:15px; display:flex; justify-content:center; gap:20px;">
      <label><input type="checkbox" id="autoPrint" style="accent-color: var(--primary);"> 🖨️ طباعة تلقائية</label>
      <button class="btn btn-print" onclick="printLastScan()"><i class="fa-solid fa-print"></i> طباعة آخر شحنة</button>
    </div>
    <div id="alertBanner" class="alert-banner"></div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><p>إجمالي الشيت</p><h3 id="statTotal">0</h3></div>
    <div class="stat-card"><p>الممسوح بالمقر</p><h3 id="statScanned" style="color:var(--green)">0</h3></div>
    <div class="stat-card"><p>إكسبورت الكنسل الـ 4</p><h3 id="statCancel" style="color:var(--red)">0</h3></div>
    <div class="stat-card"><p>مرتجع (CANCEL RTO)</p><h3 id="statCancelRTO" style="color:#f87171">0</h3></div>
  </div>

  <div class="action-panel">
    <button class="btn btn-green" onclick="exportScannedOnly()"><i class="fa-solid fa-file-excel"></i> تصدير الممسوح (<span id="btnScannedCnt">0</span>)</button>
    <button class="btn btn-red" onclick="exportCategoryOnly('CANCEL')"><i class="fa-solid fa-file-export"></i> تصدير الكنسل (<span id="btnCancelCnt">0</span>)</button>
    <button class="btn btn-cancel-rto" onclick="exportCategoryOnly('CANCEL_RTO')"><i class="fa-solid fa-file-export"></i> تصدير Cancel RTO (<span id="btnCancelRtoCnt">0</span>)</button>
    <button class="btn" onclick="exportMissingReport()" style="background:#374151; color:#fff;"><i class="fa-solid fa-download"></i> تصدير المفقودات</button>
  </div>

  <h3 style="margin-bottom:12px; font-size:16px;"><i class="fa-solid fa-list-check" style="color:var(--primary)"></i> سجل حركة التسكين (مباشر لكل الأجهزة)</h3>
  <div class="table-container">
    <table class="logs-table">
      <thead>
        <tr>
          <th>رقم تتبع الشحنة</th>
          <th>الموظف</th>
          <th>الوقت</th>
          <th>التصنيف</th>
          <th>سبب الاستثناء / التوجيه</th>
        </tr>
      </thead>
      <tbody id="logsBody">
        <tr><td colspan="5" style="color:var(--text-muted); padding:30px;">في انتظار البيانات...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://bosta-hub-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let masterMap = {};
    let scannedMap = {};
    let scanTimeout = null;

    const ALLOWED_CANCEL_REASONS = [
      "cancellation - the customer refuses to receive the shipment.",
      "cancellation - the customer refuses to receive the shipment",
      "cancellation - product issue",
      "cancellation - the customer wants to open the shipment.",
      "cancellation - the customer wants to open the shipment",
      "cancellation - shipment opened by force and refused by consignee"
    ];

    db.ref('.info/connected').on('value', (snap) => {
      let st = document.getElementById('syncStatus');
      if (snap.val() === true) {
        st.style.color = 'var(--green)';
        st.innerText = '● متصل ومزامن مباشرة ⚡';
      } else {
        st.style.color = 'var(--orange)';
        st.innerText = '● جاري التوصيل...';
      }
    });

    db.ref('master').on('value', (snapshot) => {
      masterMap = snapshot.val() || {};
      updateStats();
    });

    db.ref('scanned').on('value', (snapshot) => {
      scannedMap = snapshot.val() || {};
      updateStats();
      renderLogs();
    });

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let u = new SpeechSynthesisUtterance(text); u.lang = 'ar-SA'; u.rate = 1.1;
        window.speechSynthesis.speak(u);
      }
    }

    function getVal(row, keys, def = "--") {
      let rKeys = Object.keys(row);
      for (let k of keys) {
        let m = rKeys.find(rk => rk.trim().toLowerCase() === k.toLowerCase());
        if (m && row[m] !== undefined && row[m] !== null && String(row[m]).trim() !== "") return String(row[m]).trim();
      }
      return def;
    }

    document.getElementById('excelFile').addEventListener('change', function(e) {
      let file = e.target.files[0]; if (!file) return;
      let reader = new FileReader();
      reader.onload = function(e) {
        let data = new Uint8Array(e.target.result);
        let wb = XLSX.read(data, { type: 'array' });
        let jsonData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
        let newMaster = {};
        jsonData.forEach(row => {
          let trk = getVal(row, ["Tracking Number", "tracking number", "Tracking"], Object.values(row)[0]);
          if (trk && trk !== "--") {
            trk = String(trk).trim().replace(/[.#$/\[\]]/g, "_");
            let rawStatus = getVal(row, ["Delivery State", "Status"], "").toLowerCase();
            let rawType = getVal(row, ["Type"], "").toLowerCase();
            let rawReason = getVal(row, ["Latest Exception Reason", "Exception Reason"], "").toLowerCase();
            let isRTO = rawType.includes("rto") || rawStatus.includes("rto") || rawReason.includes("rto");
            let isCancel = ALLOWED_CANCEL_REASONS.some(r => rawReason.includes(r));
            let category = isRTO ? "CANCEL_RTO" : (isCancel ? "CANCEL" : "OTHER");
            newMaster[trk] = {
              category: category, details: isRTO ? "مرتجع RTO" : (isCancel ? "إكسبورت الكنسل" : "شحنة أخرى"),
              voiceText: isRTO ? "مرتجع" : (isCancel ? "كنسل عادي" : "أخرى"),
              rawReason: rawReason || "--", originalRow: row
            };
          }
        });
        db.ref('master').set(newMaster);
        speakText("تم رفع الشيت بنجاح لجميع الأجهزة");
      };
      reader.readAsArrayBuffer(file);
    });

    const barcodeInput = document.getElementById('barcode');
    barcodeInput.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); triggerScan(); } });
    barcodeInput.addEventListener('input', () => { clearTimeout(scanTimeout); scanTimeout = setTimeout(triggerScan, 150); });

    function triggerScan() {
      let code = barcodeInput.value.trim().replace(/[.#$/\[\]]/g, "_");
      let user = document.getElementById('username').value.trim() || 'موظف';
      if (code.length >= 4) { processScan(code, user); barcodeInput.value = ''; }
    }

    function processScan(code, user) {
      let alertBanner = document.getElementById('alertBanner');
      alertBanner.style.display = 'block';
      if (scannedMap[code]) {
        alertBanner.className = 'alert-banner alert-DUPLICATE';
        alertBanner.innerHTML = `⚠️ مكرر! تم مسحه سابقاً بواسطة (${scannedMap[code].user})`;
        speakText("مكرر");
      } else {
        let info = masterMap[code];
        let category = info ? info.category : "UNKNOWN";
        let scanItem = {
          user: user, time: new Date().toLocaleTimeString('ar-EG'), category: category,
          details: info ? info.details : "غير مدرج", rawReason: info ? info.rawReason : "--"
        };
        db.ref('scanned/' + code).set(scanItem);
        alertBanner.className = 'alert-banner alert-' + category;
        alertBanner.innerHTML = `شحنة: ${code} (${user})<br>${scanItem.details}`;
        speakText(info ? info.voiceText : "مفقود");
      }
    }

    function updateStats() {
      let mKeys = Object.keys(masterMap), sKeys = Object.keys(scannedMap);
      document.getElementById('statTotal').innerText = mKeys.length;
      document.getElementById('statScanned').innerText = sKeys.length;
      document.getElementById('statCancel').innerText = mKeys.filter(k => masterMap[k].category === "CANCEL").length;
      document.getElementById('statCancelRTO').innerText = mKeys.filter(k => masterMap[k].category === "CANCEL_RTO").length;
      document.getElementById('btnScannedCnt').innerText = sKeys.length;
      document.getElementById('btnCancelCnt').innerText = mKeys.filter(k => masterMap[k].category === "CANCEL").length;
      document.getElementById('btnCancelRtoCnt').innerText = mKeys.filter(k => masterMap[k].category === "CANCEL_RTO").length;
    }

    function renderLogs() {
      let tbody = document.getElementById('logsBody'); tbody.innerHTML = '';
      let keys = Object.keys(scannedMap).reverse();
      if (!keys.length) { tbody.innerHTML = '<tr><td colspan="5" style="padding:30px;">في انتظار البيانات...</td></tr>'; return; }
      keys.forEach(code => {
        let item = scannedMap[code];
        tbody.innerHTML += `<tr>
          <td><b>${code}</b></td><td>${item.user}</td><td>${item.time}</td>
          <td>${item.category}</td><td>${item.rawReason}</td>
        </tr>`;
      });
    }

    function resetDayData() {
      if (confirm("هل أنت متأكد من تصفير شغل اليوم لجميع الأجهزة؟")) {
        db.ref('scanned').remove();
      }
    }
  </script>
</body>
</html>
